  const v=$('#viewer');
  v.innerHTML=`<div class="vw"><div class="vw-head"><span class="doc-ico" style="width:30px;height:36px">${ext(d)}</span><h2>${esc(d.name)}</h2>
    <button class="btn small" data-act="dlDoc">⤓ Herunterladen</button><button class="icon-btn" data-act="closeViewer" aria-label="Schliessen" style="font-size:1.2rem">✕</button></div>
    <div class="vw-body" id="vwBody"><div class="muted" style="padding:40px">Wird geöffnet…</div></div></div>`;
  v.showModal();
  const body=$('#vwBody');
  try{
    const blob=await getDocBlob(d); viewerBlob=blob; if(viewerDoc!==d) return;
    const type=d.contentType||blob.type||'';
    if(type.startsWith('image/')){ body.innerHTML=''; const img=new Image(); img.alt=d.name; img.src=URL.createObjectURL(blob); body.appendChild(img); }
    else if(type.includes('pdf')){
      const lib=await loadPdfJs(); const pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
      body.innerHTML=''; const w=Math.min(body.clientWidth-32,900);
      for(let i=1;i<=pdf.numPages;i++){
        if(viewerDoc!==d||!v.open) return;
        const page=await pdf.getPage(i); const vp0=page.getViewport({scale:1}); const scale=w/vp0.width*(window.devicePixelRatio||1);
        const vp=page.getViewport({scale}); const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.style.width=w+'px';
        body.appendChild(c); await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      }
    } else { body.innerHTML=`<pre>${esc(await blob.text())}</pre>`; }
  }catch(e){ console.error(e); body.innerHTML=`<div style="padding:40px;text-align:center"><b>Vorschau nicht möglich.</b><p class="muted">${esc(e.message||'')}</p><p>Du kannst die Datei aber herunterladen.</p></div>`; }
}
async function downloadDoc(){
  const d=viewerDoc; if(!d) return;
  try{ const blob=viewerBlob||await getDocBlob(d); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${d.name}.${extFor(d)}`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); }
  catch(e){ console.error(e); toast('Herunterladen nicht möglich'); }
}
async function delDoc(id){
  const d=S.docs.find(x=>x.id===id); if(!d||!await askConfirm(`„${d.name}“ endgültig löschen?`)) return;
  try{ await deleteRemoteFile(d); }catch(e){ console.error(e); toast(errText(e)); return; }
  S.docs=S.docs.filter(x=>x!==d); mark(); render();
}

/* ---------- Events ---------- */
function toggleTask(id,checked){ const it=S.items.find(i=>i.id===id); if(!it) return; it.done=checked;
  if(checked&&it.repeat&&!it.nextId){ const nd=addInterval(it.date||todayISO(),it.repeat);
    if(!it.repeat.until||nd<=it.repeat.until){ const n=JSON.parse(JSON.stringify(it)); Object.assign(n,{id:uid(),date:nd,done:false,createdAt:new Date().toISOString(),subtasks:(it.subtasks||[]).map(s=>({...s,id:uid(),done:false}))}); delete n.nextId; S.items.push(n); it.nextId=n.id; toast(`Erledigt – nächste am ${fmtDShort(nd)}`); }
    else toast(`„${it.title}“ erledigt – Serie beendet`); }
  else if(!checked&&it.nextId){ const n=S.items.find(x=>x.id===it.nextId); if(n&&!n.done&&!n.nextId) S.items=S.items.filter(x=>x!==n); delete it.nextId; }
  else if(checked) toast(`„${it.title}“ erledigt`); mark('items'); render(); }
document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('#tabs button'); if(tabBtn){ ui.tab=tabBtn.dataset.tab; render(); scrollTo(0,0); return; }
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act, id=a.dataset.id;
  if(act!=='dayNew') e.stopPropagation();
  switch(act){
    case 'tab': ui.tab=a.dataset.tab; render(); break;
    case 'new': if(a.dataset.type==='task'&&!defaultTaskGroup()){ toast('Keine Gruppe erlaubt Aufgaben – schalte es bei einer Gruppe ein'); break; } openItem(null,{day:a.dataset.day,type:a.dataset.type,test:!!a.dataset.test}); break;
    case 'dayNew': if(e.target===a){ ui.selDay=a.dataset.day; openItem(null,{day:a.dataset.day}); } break;
    case 'open': ui.occ=a.dataset.occ||null; openItem(id); break;
    case 'toggle': toggleTask(id,a.checked); break;
    case 'subQuick': { const it=S.items.find(i=>i.id===id); const s=it.subtasks.find(x=>x.id===a.dataset.sid); s.done=a.checked; mark('items'); render(); break; }
    case 'selDay': ui.selDay=a.dataset.day; { const d=parseISO(ui.selDay); if(d.getMonth()!==ui.calMonth.getMonth()) ui.calMonth=new Date(d.getFullYear(),d.getMonth(),1); } render(); break;
    case 'calPrev': ui.calMonth=new Date(ui.calMonth.getFullYear(),ui.calMonth.getMonth()-1,1); render(); break;
    case 'calNext': ui.calMonth=new Date(ui.calMonth.getFullYear(),ui.calMonth.getMonth()+1,1); render(); break;
    case 'calToday': ui.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1); ui.selDay=todayISO(); render(); break;
    case 'dType': readDraft(); if(a.dataset.type==='task'&&!defaultTaskGroup()){ toast('Keine Gruppe erlaubt Aufgaben – schalte es bei einer Gruppe ein'); break; }
      draft.type=a.dataset.type; if(draft.type==='task'&&!allowsTasks(grp(draft.group))) draft.group=defaultTaskGroup(); renderDlg(); break;
    case 'dTest': readDraft(); renderDlg(); break;
    case 'subToggle': { readDraft(); const s=draft.subtasks.find(x=>x.id===a.dataset.sid); s.done=a.checked; renderDlg(); break; }
    case 'subDel': readDraft(); draft.subtasks=draft.subtasks.filter(x=>x.id!==a.dataset.sid); renderDlg(); break;
    case 'delItem': deleteItem(); break;
    case 'closeDlg': $('#dlg').close(); render(); break;
    case 'clearDone': askConfirm('Alle erledigten Aufgaben dieser Gruppe löschen?').then(ok=>{ if(ok){ S.items=S.items.filter(i=>!(i.type==='task'&&i.done&&i.group===id)); mark('items'); render(); } }); break;
    case 'grpNew': openGroup(null); break;
    case 'grpEdit': openGroup(id); break;
    case 'grColor': gdraft.tasks=$('#gr_tasks').checked; gdraft.name=$('#gr_name').value; gdraft.color=a.dataset.c; renderGroupDlg(); break;
    case 'grpDel': deleteGroup(); break;
    case 'settings': if(loaded) openSettings(); break;
    case 'syncNow': if(pendingSave) pushNow(); else syncNow(); break;
    case 'logout': askConfirm('Auf diesem Gerät abmelden? Deine Daten bleiben im GitHub-Repo.','Abmelden').then(ok=>{ if(ok) logout(); }); break;

    case 'setOpt': { let v=a.dataset.v; if(v==='true') v=true; else if(v==='false') v=false; else if(/^\d$/.test(v)) v=+v; S.meta.settings[a.dataset.k]=v; applySettings(); mark('meta'); openSettings(); render(); break; }
    case 'setAccent': S.meta.settings.accent=a.dataset.c; applySettings(); mark('meta'); openSettings(); break;
    case 'gview': ui.gradeView=id; render(); break;
    case 'newGrade': openGrade(null); break;
    case 'editGrade': openGrade(id); break;
    case 'delGrade': { const g=S.grades.find(x=>x.id===gd.id); if(!g) break; askConfirm('Diese Note löschen?').then(ok=>{ if(!ok) return; if(g.testId){ g.grade=null; g.enteredAt=null; toast('Note entfernt – sie ist wieder offen'); } else S.grades=S.grades.filter(x=>x!==g); mark('grades'); $('#dlg').close(); render(); }); break; }
    case 'saveGradeInline': { const inp=document.querySelector(`[data-gradein="${a.dataset.gid}"]`); const g=S.grades.find(x=>x.id===a.dataset.gid);
      if(!inp.value.trim()){ toast('Bitte eine Note eingeben'); inp.focus(); break; } if(setGrade(g,inp.value)){ toast(`Note ${gfmt(g.grade)} in ${g.subject||KINDS[g.kind||'fach']} eingetragen`); render(); } break; }
    case 'manage': openManage(); break;
    case 'semAdd': { const n=$('#newSem').value.trim(); if(!n) break; S.meta.semesters.push({id:uid(),name:n}); mark('meta'); openManage(); break; }
    case 'semActive': S.meta.activeSem=id; mark('meta'); openManage(); break;
    case 'semDel': { if(S.meta.semesters.length<=1){ toast('Mindestens ein Semester wird gebraucht'); break; } if(S.grades.some(g=>g.semesterId===id)){ toast('Dieses Semester hat noch Noten'); break; }
      S.meta.semesters=S.meta.semesters.filter(s=>s.id!==id); if(S.meta.activeSem===id) S.meta.activeSem=S.meta.semesters.at(-1).id; if(ui.gradeView===id) ui.gradeView=S.meta.activeSem; mark('meta'); openManage(); break; }
    case 'subjAdd': { const k=a.dataset.k; const n=$('#new_'+k).value.trim(); addToCatalog(k,n); openManage(); break; }
    case 'subjDel': { const k=a.dataset.k; S.meta.catalog[k]=S.meta.catalog[k].filter(s=>s!==a.dataset.name); mark('meta'); openManage(); break; }
    case 'dKind': readDraft(); draft.kind=a.dataset.k; renderDlg(); break;
    case 'gKind': readGrade(); gd.kind=a.dataset.k; renderGradeDlg(); break;
    case 'dlDoc': downloadDoc(); break;
    case 'closeViewer': $('#viewer').close(); viewerDoc=null; break;
    case 'pickFiles': $('#hiddenFile').click(); break;
    case 'cd': ui.folder=id||null; ui.docQ=''; render(); break;
    case 'folderNew': askText('Neuer Ordner','','Erstellen').then(n=>{ if(!n) return; S.meta.folders.push({id:uid(),name:n,parentId:ui.folder}); mark('meta'); render(); }); break;
    case 'folderRename': { const f=folderById(id); askText('Ordner umbenennen',f.name).then(n=>{ if(!n) return; f.name=n; mark('meta'); render(); }); break; }
    case 'docRename': { const d=S.docs.find(x=>x.id===id); askText('Datei umbenennen',d.name).then(n=>{ if(!n) return; d.name=n; mark('docs'); render(); }); break; }
    case 'folderMove': openMoveDlg('folder',id); break;
    case 'docMove': openMoveDlg('doc',id); break;
    case 'folderDel': deleteFolder(id); break;
    case 'openDoc': openDoc(id); break;
    case 'delDoc': delDoc(id); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.input==='gsem'){ ui.gradeView=t.value; ui.lastSem=t.value; render(); return; }
  if(t.id==='f_rep'||t.id==='f_repUnit'||(t.id==='f_date'&&$('#f_rep'))){ readDraft(); renderDlg(); return; }
  if(t.id==='importFile'&&t.files[0]){ importFile(t.files[0]); t.value=''; return; }
  if(t.id==='hiddenFile'){ uploadFiles([...t.files],ui.folder); t.value=''; return; }
  if(t.dataset.grpvis){ const h=S.meta.settings.hidden; const i=h.indexOf(t.dataset.grpvis); if(t.checked&&i>-1) h.splice(i,1); if(!t.checked&&i<0) h.push(t.dataset.grpvis); mark('meta'); render(); }
  if(t.dataset.semname){ const s=S.meta.semesters.find(x=>x.id===t.dataset.semname); if(s&&t.value.trim()){ s.name=t.value.trim(); mark('meta'); } }
  if(t.id==='gr_custom'){ gdraft.tasks=$('#gr_tasks').checked; gdraft.name=$('#gr_name').value; gdraft.color=t.value; renderGroupDlg(); }
  if(t.id==='set_accent'){ S.meta.settings.accent=t.value; applySettings(); mark('meta'); openSettings(); }
});
document.addEventListener('input',e=>{ if(e.target.dataset.input==='docQ'){ ui.docQ=e.target.value; const pos=e.target.selectionStart; render(); const i=document.querySelector('[data-input="docQ"]'); i.focus(); i.setSelectionRange(pos,pos); } });
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(e.key==='Enter'&&t.id==='f_newsub'){ e.preventDefault(); addSub(); }
  if(e.key==='Enter'&&t.dataset.quick){ e.preventDefault(); const v=t.value.trim(); if(!v) return;
    S.items.push({id:uid(),type:'task',title:v,date:'',endDate:'',group:t.dataset.quick,desc:'',subtasks:[],done:false,test:false,createdAt:new Date().toISOString()});
    mark('items'); const q=t.dataset.quick; render(); document.querySelector(`[data-quick="${q}"]`)?.focus(); }
  if(e.key==='Enter'&&t.classList.contains('grade-in')){ e.preventDefault(); t.nextElementSibling?.click(); }
  if(e.key==='Enter'&&(t.id==='newSem'||t.id.startsWith('new_'))){ e.preventDefault(); t.nextElementSibling?.click(); }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='setupForm'){ e.preventDefault(); const b=e.target.querySelector('button'); b.disabled=true; b.textContent='Prüfe…';
    connect($('#su_owner').value.trim(),$('#su_repo').value.trim(),$('#su_token').value.trim()).then(()=>init()).catch(err=>showSetup(err.message,{owner:$('#su_owner').value.trim(),repo:$('#su_repo').value.trim()})); return; }
  if(e.target.id==='itemForm'){ e.preventDefault(); saveItem(); }
  if(e.target.id==='gradeForm'){ e.preventDefault(); saveGradeDlg(); }
  if(e.target.id==='groupForm'){ e.preventDefault(); saveGroup(); }
});
window.addEventListener('beforeunload',e=>{ if(pendingSave){ pushNow(); e.preventDefault(); e.returnValue=''; } });
render(); init();
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
